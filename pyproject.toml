[project]
name = "clinical-llm-safety-harness"
version = "0.1.0"
description = "Hallucination detection, citation enforcement, safeguarding escalation, and human-in-the-loop review for clinical LLM outputs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raphael T. Malikian" }]
keywords = ["clinical-ai", "llm-safety", "hallucination-detection", "citation-verification",
            "human-in-the-loop", "healthcare-ai", "patient-safety", "hipaa", "eval-harness",
            "medical-ai", "rag-evaluation", "clinical-nlp"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/rtmalikian/clinical-llm-safety-harness"
Issues = "https://github.com/rtmalikian/clinical-llm-safety-harness/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
